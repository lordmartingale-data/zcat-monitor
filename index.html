<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZCAT pool volume</title>
<style>
  :root {
    --ground: #17131f;
    --panel: #201a2b;
    --panel-edge: #2f2740;
    --ink: #ece6f6;
    --muted: #9b8fb4;
    --faint: #6b6082;
    --price: #6ea8ff;
    --up: #5ed3a0;
    --down: #ef7b8e;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: ui-sans-serif, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
  }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 72px; }

  header { margin-bottom: 28px; }
  h1 { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }
  .sub b { color: var(--ink); font-weight: 600; }

  .flow-bar { display: flex; height: 72px; border-radius: 5px; overflow: hidden; background: var(--panel); }
  .flow-seg { position: relative; min-width: 3px; }
  .flow-seg span {
    position: absolute; left: 9px; bottom: 7px;
    font-size: 12px; font-weight: 600; color: #17131f; white-space: nowrap;
  }

  .legend {
    display: flex; flex-wrap: wrap; gap: 6px 18px;
    margin-top: 12px; font-size: 13px; color: var(--muted);
  }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 7px; vertical-align: 1px; }
  .legend button {
    background: none; border: 0; padding: 0; margin: 0; font: inherit;
    color: var(--muted); cursor: pointer;
  }
  .legend button[aria-pressed="false"] { opacity: .35; text-decoration: line-through; }

  .head-row {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; margin: 40px 0 14px; flex-wrap: wrap;
  }
  h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0; }

  .ranges { display: flex; gap: 4px; }
  .ranges button {
    background: none; border: 1px solid var(--panel-edge); color: var(--muted);
    border-radius: 4px; padding: 3px 11px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .ranges button[aria-pressed="true"] { background: var(--panel-edge); color: var(--ink); }

  .plot { position: relative; }
  .chart { width: 100%; height: 340px; display: block; touch-action: none; }
  .axis { fill: var(--faint); font-size: 11px; }
  .axis-price { fill: var(--price); font-size: 11px; opacity: .8; }
  .grid { stroke: var(--panel-edge); stroke-width: 1; }
  .guide { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; opacity: .6; }

  .tip {
    position: absolute; pointer-events: none; z-index: 3;
    background: #0f0c16; border: 1px solid var(--panel-edge);
    border-radius: 6px; padding: 10px 12px; font-size: 13px;
    min-width: 190px; box-shadow: 0 8px 28px rgba(0,0,0,.55);
    opacity: 0; transition: opacity .1s;
  }
  .tip.on { opacity: 1; }
  .tip h4 { margin: 0 0 7px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .tip .row { display: flex; align-items: center; gap: 7px; margin-top: 3px; }
  .tip .row i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .tip .row b { margin-left: auto; font-weight: 600; }
  .tip .tot { margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--panel-edge); }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: right; font-size: 12px; font-weight: 500; color: var(--faint);
    padding: 0 0 9px; border-bottom: 1px solid var(--panel-edge);
  }
  th:first-child { text-align: left; }
  td { padding: 13px 0; border-bottom: 1px solid var(--panel-edge); text-align: right; white-space: nowrap; }
  td:first-child { text-align: left; white-space: normal; }
  tbody tr:hover { background: rgba(255,255,255,.025); }

  .pool { display: flex; align-items: baseline; gap: 9px; }
  .swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; align-self: center; }
  .pair { font-weight: 600; }
  .pair a { color: inherit; text-decoration: none; }
  .pair a:hover { text-decoration: underline; }
  .venue { color: var(--muted); font-size: 13px; }

  .delta-up { color: var(--up); }
  .delta-down { color: var(--down); }
  .dim { color: var(--faint); }

  .note { margin-top: 10px; font-size: 12px; color: var(--faint); }

  .empty {
    background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: 5px; padding: 26px; color: var(--muted);
  }
  .empty code { color: var(--ink); background: rgba(255,255,255,.06); padding: 2px 6px; border-radius: 3px; }

  footer {
    margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--panel-edge);
    color: var(--faint); font-size: 13px;
  }
  footer a { color: var(--muted); }

  @media (max-width: 620px) {
    .hide-sm { display: none; }
    .chart { height: 260px; }
    .flow-bar { height: 58px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  button:focus-visible, a:focus-visible { outline: 2px solid #b39bff; outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>ZCAT pool volume</h1>
    <p class="sub" id="strap">Loading…</p>
  </header>

  <div id="body"></div>

  <footer>
    Data from the DexScreener token API, collected hourly by GitHub Actions.
    Pools enter the set when 24h volume first clears $900K and are tracked from then on.
    Times shown in Bangkok time (UTC+7).
    <a href="https://dexscreener.com/solana/HcRLc9VDgjLeK154xDawfb1dmVJ98DoSqcwTHGqiDeJR">View on DexScreener</a>
  </footer>

</div>

<script>
const PALETTE = ["#f2b441","#8b7cff","#4fc3a1","#ef7b8e","#5bb8e8","#d98cd0","#9ec96a","#f09359"];
const TZ = "Asia/Bangkok";

const usd = n =>
  n >= 1e9 ? "$" + (n / 1e9).toFixed(2) + "B" :
  n >= 1e6 ? "$" + (n / 1e6).toFixed(2) + "M" :
  n >= 1e3 ? "$" + (n / 1e3).toFixed(0) + "K" :
  "$" + Math.round(n);

const pct = n => (n * 100).toFixed(1) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

// All display times are Bangkok, regardless of the viewer's own timezone.
const hourLabel = iso => new Date(iso).toLocaleTimeString("en-GB",
  { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
const dayLabel = iso => new Date(iso).toLocaleDateString("en-GB",
  { timeZone: TZ, day: "numeric", month: "short" });
const fullLabel = iso => dayLabel(iso) + ", " + hourLabel(iso);

function ago(iso) {
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (mins < 2) return "just now";
  if (mins < 60) return mins + " min ago";
  const hrs = Math.round(mins / 60);
  return hrs + (hrs === 1 ? " hour ago" : " hours ago");
}

let NAMES = {};
function namePools(pools, addrs) {
  const counts = {};
  addrs.forEach(a => { counts[pools[a].quote] = (counts[pools[a].quote] || 0) + 1; });
  NAMES = {};
  addrs.forEach(a => {
    const base = "ZCAT/" + pools[a].quote;
    NAMES[a] = counts[pools[a].quote] > 1 ? base + " " + a.slice(0, 4) : base;
  });
}
const label = (meta, addr) => NAMES[addr] || ("ZCAT/" + meta.quote);

function venue(meta) {
  const kind = (meta.labels || []).join(" ");
  const dex = meta.dex.charAt(0).toUpperCase() + meta.dex.slice(1);
  return kind ? dex + " " + kind : dex;
}

// A 1h figure larger than the pool's own 24h figure is impossible, so treat it
// as a bad feed reading. Older snapshots predate the collector-side guard.
function valid(r) {
  if (!r || typeof r.v1 !== "number" || r.v1 < 0) return false;
  if (r.v24 > 0 && r.v1 > r.v24 * 1.02) return false;
  return true;
}
const vol = r => valid(r) ? r.v1 : 0;

let STATE = { hours: 24, hidden: new Set(), data: null, addrs: [], colours: {} };

function draw() {
  const h = STATE.data, addrs = STATE.addrs, colours = STATE.colours;
  const all = h.snapshots;
  const snaps = STATE.hours ? all.slice(-STATE.hours) : all;
  const shown = addrs.filter(a => !STATE.hidden.has(a));

  const W = 1040, H = 340, L = 62, R = 58, T = 18, B = 34;
  const iw = W - L - R, ih = H - T - B;
  const n = snaps.length;
  const band = iw / Math.max(n, 1);
  const bw = Math.max(1.5, band * 0.72);
  const cx = i => L + band * (i + 0.5);

  const totals = snaps.map(s => shown.reduce((sum, a) => sum + vol(s.pools[a]), 0));
  const vmax = Math.max(1, ...totals);

  // Reference price comes from the deepest pool that has one in this window.
  const ref = addrs.find(a => snaps.some(s => ((s.pools[a] || {}).px || 0) > 0));
  const prices = snaps.map(s => ((s.pools[ref] || {}).px) || null);
  const known = prices.filter(p => p);
  const pmin = known.length ? Math.min.apply(null, known) : 0;
  const pmax = known.length ? Math.max.apply(null, known) : 1;
  const pad = (pmax - pmin) * 0.15 || pmax * 0.05 || 1;
  const plo = Math.max(0, pmin - pad), phi = pmax + pad;

  const y = v => T + ih - (v / vmax) * ih;
  const yp = p => T + ih - ((p - plo) / (phi - plo)) * ih;

  let svg = '<svg class="chart" id="svg" viewBox="0 0 ' + W + ' ' + H + '"' +
    ' preserveAspectRatio="none" role="img"' +
    ' aria-label="Hourly volume per pool as stacked bars, with ZCAT price">';

  for (let g = 0; g <= 4; g++) {
    const v = (vmax / 4) * g, yy = y(v);
    svg += '<line class="grid" x1="' + L + '" y1="' + yy.toFixed(1) +
      '" x2="' + (W - R) + '" y2="' + yy.toFixed(1) + '"/>';
    svg += '<text class="axis" x="' + (L - 9) + '" y="' + (yy + 4).toFixed(1) +
      '" text-anchor="end">' + usd(v) + '</text>';
  }

  if (known.length) {
    for (let g = 0; g <= 4; g++) {
      const p = plo + ((phi - plo) / 4) * g;
      svg += '<text class="axis-price" x="' + (W - R + 9) + '" y="' + (yp(p) + 4).toFixed(1) +
        '" text-anchor="start">$' + p.toFixed(4) + '</text>';
    }
  }

  snaps.forEach((s, i) => {
    let base = 0;
    shown.forEach(a => {
      const v = vol(s.pools[a]);
      if (v <= 0) return;
      const y0 = y(base + v), y1 = y(base);
      svg += '<rect x="' + (cx(i) - bw / 2).toFixed(1) + '" y="' + y0.toFixed(1) +
        '" width="' + bw.toFixed(1) + '" height="' + Math.max(0.5, y1 - y0).toFixed(1) +
        '" fill="' + colours[a] + '" opacity=".92"/>';
      base += v;
    });
  });

  if (known.length > 1) {
    let d = "", pen = false;
    prices.forEach((p, i) => {
      if (!p) { pen = false; return; }
      d += (pen ? "L" : "M") + cx(i).toFixed(1) + "," + yp(p).toFixed(1) + " ";
      pen = true;
    });
    svg += '<path d="' + d + '" fill="none" stroke="var(--price)" stroke-width="2"' +
      ' stroke-linejoin="round" stroke-linecap="round"/>';
  }

  const ticks = Math.min(7, n);
  let lastDay = "";
  for (let t = 0; t < ticks; t++) {
    const i = Math.round((t / Math.max(1, ticks - 1)) * (n - 1));
    const d = dayLabel(snaps[i].t);
    const txt = d === lastDay ? hourLabel(snaps[i].t) : d + " " + hourLabel(snaps[i].t);
    lastDay = d;
    svg += '<text class="axis" x="' + cx(i).toFixed(1) + '" y="' + (H - 11) +
      '" text-anchor="middle">' + txt + '</text>';
  }

  svg += '<line class="guide" id="guide" x1="0" y1="' + T + '" x2="0" y2="' + (T + ih) +
    '" style="display:none"/>';
  svg += '<rect id="hit" x="' + L + '" y="' + T + '" width="' + iw + '" height="' + ih +
    '" fill="transparent"/></svg>';

  document.getElementById("plot").innerHTML = svg + '<div class="tip" id="tip"></div>';
  wireHover(snaps, shown, { W: W, L: L, T: T, ih: ih, band: band, cx: cx, ref: ref });
}

function wireHover(snaps, shown, geo) {
  const h = STATE.data, colours = STATE.colours;
  const svg = document.getElementById("svg");
  const tip = document.getElementById("tip");
  const guide = document.getElementById("guide");
  const plot = document.getElementById("plot");

  function at(ev) {
    const box = svg.getBoundingClientRect();
    const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
    const px = (clientX - box.left) / box.width * geo.W;
    let i = Math.floor((px - geo.L) / geo.band);
    i = Math.max(0, Math.min(snaps.length - 1, i));
    const s = snaps[i];

    guide.style.display = "";
    guide.setAttribute("x1", geo.cx(i));
    guide.setAttribute("x2", geo.cx(i));

    const rows = shown.map(a => ({ a: a, v: vol(s.pools[a]) }))
      .filter(r => r.v > 0)
      .sort((x, z) => z.v - x.v);
    const total = rows.reduce((t, r) => t + r.v, 0);
    const price = (s.pools[geo.ref] || {}).px;

    tip.innerHTML = "<h4>" + fullLabel(s.t) + "</h4>" +
      rows.map(r => '<div class="row"><i style="background:' + colours[r.a] + '"></i>' +
        esc(label(h.pools[r.a], r.a)) + "<b>" + usd(r.v) + "</b></div>").join("") +
      '<div class="row tot">Total<b>' + usd(total) + "</b></div>" +
      (price ? '<div class="row"><i style="background:var(--price)"></i>Price<b>$' +
        price.toFixed(5) + "</b></div>" : "");

    tip.classList.add("on");
    const rel = (geo.cx(i) / geo.W) * plot.clientWidth;
    const w = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(plot.clientWidth - w, rel - w / 2)) + "px";
    tip.style.top = "8px";
  }

  svg.addEventListener("mousemove", at);
  svg.addEventListener("touchstart", at, { passive: true });
  svg.addEventListener("touchmove", function (e) { e.preventDefault(); at(e); }, { passive: false });
  svg.addEventListener("mouseleave", function () {
    tip.classList.remove("on");
    guide.style.display = "none";
  });
}

function render(h) {
  const strap = document.getElementById("strap");
  const body = document.getElementById("body");
  const snaps = h.snapshots || [];

  if (!snaps.length) {
    strap.textContent = "No snapshots yet.";
    body.innerHTML = '<div class="empty">The collector hasn\'t run yet. Open the Actions tab and run ' +
      "<code>Collect pool volume</code> once to seed the history.</div>";
    return;
  }

  const last = snaps[snaps.length - 1];
  const prev = snaps.length > 1 ? snaps[snaps.length - 2] : null;
  const addrs = Object.keys(last.pools).sort((a, b) => vol(last.pools[b]) - vol(last.pools[a]));
  namePools(h.pools, addrs);

  const colours = {};
  addrs.forEach((a, i) => colours[a] = PALETTE[i % PALETTE.length]);
  STATE.data = h; STATE.addrs = addrs; STATE.colours = colours;

  const hourTotal = addrs.reduce((s, a) => s + vol(last.pools[a]), 0);
  const dayTotal = addrs.reduce((s, a) => s + (last.pools[a].v24 || 0), 0);

  let dropped = 0;
  snaps.forEach(s => addrs.forEach(a => { if (s.pools[a] && !valid(s.pools[a])) dropped++; }));

  strap.innerHTML = "<b>" + usd(hourTotal) + "</b> traded in the last hour across " +
    addrs.length + " pools · <b>" + usd(dayTotal) + "</b> over 24h · updated " + ago(last.t);

  let flow = '<div class="flow-bar">';
  addrs.forEach(a => {
    const share = hourTotal ? vol(last.pools[a]) / hourTotal : 0;
    if (share <= 0) return;
    flow += '<div class="flow-seg" style="width:' + (share * 100).toFixed(2) + "%;background:" +
      colours[a] + '" title="' + esc(label(h.pools[a], a)) + " — " + pct(share) + '">' +
      (share > 0.09 ? "<span>" + pct(share) + "</span>" : "") + "</div>";
  });
  flow += "</div>";

  const legend = '<div class="legend" id="legend">' + addrs.map(a =>
    '<button data-a="' + a + '" aria-pressed="true"><i style="background:' + colours[a] + '"></i>' +
    esc(label(h.pools[a], a)) + ' <span class="dim">' + esc(venue(h.pools[a])) + "</span></button>").join("") +
    '<span><i style="background:var(--price)"></i>ZCAT price</span></div>';

  let rows = "";
  addrs.forEach(a => {
    const meta = h.pools[a], now = last.pools[a];
    const before = prev ? prev.pools[a] : null;
    const v1 = vol(now);
    let delta = '<span class="dim">—</span>';
    if (before && valid(before) && before.v1 > 0 && valid(now)) {
      const d = (v1 - before.v1) / before.v1;
      delta = '<span class="' + (d >= 0 ? "delta-up" : "delta-down") + '">' +
        (d >= 0 ? "+" : "") + (d * 100).toFixed(0) + "%</span>";
    }
    const turnover = now.liq > 0 ? now.v24 / now.liq : 0;
    rows += "<tr><td><div class=\"pool\"><span class=\"swatch\" style=\"background:" + colours[a] +
      "\"></span><span><span class=\"pair\"><a href=\"" + esc(meta.url) + "\" rel=\"noopener\">" +
      esc(label(meta, a)) + "</a></span> <span class=\"venue\">" + esc(venue(meta)) +
      "</span></span></div></td><td>" + (valid(now) ? usd(v1) : '<span class="dim">—</span>') +
      "</td><td>" + delta + "</td><td>" + usd(now.v24) +
      '</td><td class="hide-sm">' + usd(now.liq) +
      '</td><td class="hide-sm">' + (turnover ? turnover.toFixed(1) + "×" : "—") + "</td></tr>";
  });

  body.innerHTML = flow + legend +
    '<div class="head-row"><h2>Hourly volume and price</h2>' +
    '<div class="ranges" id="ranges">' +
    '<button data-h="24" aria-pressed="true">24H</button>' +
    '<button data-h="72" aria-pressed="false">3D</button>' +
    '<button data-h="168" aria-pressed="false">7D</button>' +
    '<button data-h="0" aria-pressed="false">All</button></div></div>' +
    '<div class="plot" id="plot"></div>' +
    (dropped ? '<p class="note">' + dropped + " implausible reading" + (dropped > 1 ? "s" : "") +
      " from the data feed excluded (1h volume exceeded the pool's own 24h volume).</p>" : "") +
    '<h2 style="margin:40px 0 14px">Pools</h2>' +
    "<table><thead><tr><th>Pool</th><th>1h vol</th><th>vs prev</th><th>24h vol</th>" +
    '<th class="hide-sm">Liquidity</th><th class="hide-sm">Turnover</th></tr></thead><tbody>' +
    rows + "</tbody></table>";

  document.getElementById("ranges").addEventListener("click", function (e) {
    const b = e.target.closest("button"); if (!b) return;
    STATE.hours = +b.dataset.h;
    Array.prototype.forEach.call(e.currentTarget.children,
      c => c.setAttribute("aria-pressed", c === b));
    draw();
  });

  document.getElementById("legend").addEventListener("click", function (e) {
    const b = e.target.closest("button"); if (!b) return;
    const a = b.dataset.a;
    if (STATE.hidden.has(a)) STATE.hidden.delete(a); else STATE.hidden.add(a);
    b.setAttribute("aria-pressed", !STATE.hidden.has(a));
    draw();
  });

  draw();
  addEventListener("resize", draw);
}

fetch("data/history.json?t=" + Date.now())
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(render)
  .catch(function (e) {
    document.getElementById("strap").textContent = "Couldn't load the data file.";
    document.getElementById("body").innerHTML =
      '<div class="empty">Reading <code>data/history.json</code> failed (' + esc(e.message) + ").</div>";
  });
</script>
</body>
</html>
