name: Collect pool volume

on:
  schedule:
    # Every 20 minutes. GitHub drops a large share of scheduled runs on shared
    # runners, so one attempt per hour loses hours. The script keeps only the
    # first success in each hour, so the extra runs are cheap insurance and
    # produce no extra commits.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch snapshot
        # A manual run always refreshes the current hour; scheduled runs don't.
        env:
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scripts/collect.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/history.json; then
            echo "No change; nothing to commit."
            exit 0
          fi
          git add data/history.json
          git commit -m "data: snapshot $(date -u +'%Y-%m-%dT%H:00Z')"
          git push
